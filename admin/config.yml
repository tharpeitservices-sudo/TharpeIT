backend:
  name: github
  repo: tharpeitservices-sudo/TharpeIT
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "homepage"
    label: "Website Content Manager"
    files:
      - file: "index.html"
        label: "Home Page Copy"
        name: "index"
        fields:
          - { label: "Main Title Headline", name: "title", widget: "string" }
          - { label: "Business Tagline", name: "tagline", widget: "string" }
          - { label: "15 Years Experience Text Block", name: "experience_text", widget: "text" }
          - { label: "Support Email Address", name: "contact_email", widget: "string" }
          - { label: "Support Phone or Text Line", name: "contact_phone", widget: "string" }
          
      - file: "reviews.json"
        label: "Approved Customer Testimonials"
        name: "testimonials"
        fields:
          - label: "Approved Reviews List"
            name: "customer_reviews"
            widget: "list"
            fields:
              - { label: "Customer Initials Avatar", name: "avatar", widget: "string", hint: "Example: JD" }
              - { label: "Customer Name Display", name: "name", widget: "string" }
              - { label: "Star Count Rating Score", name: "stars", widget: "select", options: ["★★★★★", "★★★★", "★★★", "★★", "★"] }
              - { label: "Review Narrative Description Text", name: "text", widget: "text" }
