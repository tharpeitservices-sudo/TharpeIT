<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tharpe IT Services Portal</title>
    <style>
        body {
            background-color: #1e0b36;
            background-image: radial-gradient(circle, #2d1254 10%, #0f051d 90%);
            color: #f1ebfc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(45, 18, 84, 0.6);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            margin-bottom: 20px;
        }
        h1, h2 {
            color: #bb86fc;
            text-align: center;
        }
        .tagline {
            font-style: italic;
            text-align: center;
            color: #a29bfe;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #e2d5f3;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #4a287a;
            border-radius: 6px;
            background-color: #120724;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #bb86fc;
            box-shadow: 0 0 8px rgba(187, 134, 252, 0.5);
        }
        button {
            background-color: #6200ee;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #bb86fc;
            color: #120724;
        }
        .sms-btn {
            background-color: #03dac6;
            color: #120724;
            text-align: center;
            display: block;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
        }
        .sms-btn:hover {
            background-color: #018786;
            color: white;
        }
        .review-list {
            margin-top: 20px;
            background: rgba(18, 7, 36, 0.5);
            padding: 15px;
            border-radius: 6px;
        }
        .item-card {
            border-left: 4px solid #bb86fc;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0 6px 6px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tharpe IT Services</h1>
        <div class="tagline">"providing local and simple IT services to the community"</div>
        
        <a href="sms:2078493939" class="sms-btn">💬 Text Me for Immediate Help</a>
    </div>

    <!-- Ticket System Panel -->
    <div class="container">
        <h2>Submit a Support Ticket</h2>
        <form action="https://formspree.io" method="POST">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="_replyto" id="email" required>
            </div>
            <div class="form-group">
                <label for="issue">Describe Your IT Issue</label>
                <textarea name="issue" id="issue" rows="4" required></textarea>
            </div>
            <button type="submit">Submit Ticket</button>
        </form>
    </div>

    <!-- Review System Panel -->
    <div class="container">
        <h2>Leave a Customer Review</h2>
        <form action="https://formspree.io" method="POST" id="reviewForm">
            <div class="form-group">
                <label for="revName">Your Name</label>
                <input type="text" name="reviewer_name" id="revName" required>
            </div>
            <div class="form-group">
                <label for="rating">Rating</label>
                <select name="star_rating" id="rating">
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                    <option value="2">⭐⭐ (2/5)</option>
                    <option value="1">⭐ (1/5)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="comments">Comments</label>
                <textarea name="review_text" id="comments" rows="3" required></textarea>
            </div>
            <button type="submit">Post Review</button>
        </form>

        <div class="review-list" id="reviewList">
            <h3>Recent Reviews</h3>
            <!-- Reviews will load dynamically here -->
        </div>
    </div>

    <script>
        // Formspree AJAX handler to post review dynamically on submission
        document.getElementById('reviewForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = this;
            const data = new FormData(form);
            
            fetch(form.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    const name = document.getElementById('revName').value;
                    const rating = document.getElementById('rating').value;
                    const comments = document.getElementById('comments').value;
                    
                    const reviewList = document.getElementById('reviewList');
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `<strong>${name}</strong> - ${'⭐'.repeat(rating)}<p>${comments}</p>`;
                    
                    reviewList.insertBefore(card, reviewList.firstChild);
                    form.reset();
                    alert("Thank you for your review!");
                } else {
                    alert("Oops! There was a problem submitting your review.");
                }
            }).catch(error => {
                alert("Oops! There was a problem submitting your review.");
            });
        });
    </script>
</body>
</html>
