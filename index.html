<!-- Site Review Section -->
<section id="review-system" class="card-container">
  <h2>Customer Experience Reviews</h2>
  <form id="reviewForm">
    <div class="rating-stars">
      <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="5 stars">★</label>
      <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 stars">★</label>
      <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 stars">★</label>
      <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 stars">★</label>
      <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 stars">★</label>
    </div>
    <textarea id="reviewText" placeholder="Tell us how our IT support team did..." required></textarea>
    <button type="submit" class="btn-primary">Submit Review</button>
  </form>
</section>

<!-- Modernized Ticketing Section -->
<section id="ticketing-system" class="card-container">
  <h2>Submit a Support Ticket</h2>
  <form id="ticketForm">
    <select id="ticketCategory" required>
      <option value="" disabled selected>Select Issue Category</option>
      <option value="Network">Network & Basic Connectivity</option>
      <option value="Hardware">Hardware (Desktop/Laptop/Printer)</option>
      <option value="Software">Software & Cloud Applications</option>
      <option value="Security">Security Policy / MFA Access</option>
    </select>
    <select id="ticketUrgency" required>
      <option value="Low">Low Priority</option>
      <option value="Medium" selected>Medium Priority</option>
      <option value="High">High Priority (SLA Warning)</option>
    </select>
    <textarea id="ticketDesc" placeholder="Describe the IT issue you are experiencing..." required></textarea>
    <button type="submit" class="btn-primary">Generate Ticket</button>
  </form>
</section>
