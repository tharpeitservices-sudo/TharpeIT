<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tharpe IT Services - Local Support Hub</title>
    <style>
        /* --- Premium Deep Purple & Glassmorphic Variables --- */
        :root {
            --surface-bg: #09051c;
            --panel-purple: rgba(18, 11, 41, 0.7);
            --panel-hover: rgba(26, 17, 56, 0.85);
            --input-dark: #05020c;
            --glow-violet: #651fff;
            --accent-pink: #ff4081;
            --text-light: #ffffff;
            --text-dim: #b8b4d0;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-radius: 20px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--surface-bg);
            /* Carefully optimized gradient tracking protects readability while highlighting your profile photo on the right */
            background-image: linear-gradient(to right, rgba(9, 5, 28, 0.92) 30%, rgba(9, 5, 28, 0.75) 60%, rgba(9, 5, 28, 0.4) 100%), url('hero.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            color: var(--text-light);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Floating Sticky Glass Navigation --- */
        nav {
            position: sticky;
            top: 0;
            background: rgba(9, 5, 28, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 600;
            margin-left: 30px;
            font-size: 0.9rem;
            transition: color 0.25s, text-shadow 0.25s;
        }

        .nav-links a:hover {
            color: var(--accent-pink);
            text-shadow: 0 0 12px rgba(255, 64, 129, 0.4);
        }

        .main-wrapper {
            max-width: 1300px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* --- Layout Grid Systems (Flipped to protect right side) --- */
        .workspace-grid {
            display: grid;
            /* CHANGED: Forms/Text occupy the left, leaving the right 50% clear for your photo */
            grid-template-columns: 1.1fr 0.9fr;
            gap: 60px;
            align-items: center;
            margin-bottom: 120px;
        }

        .intro-block-pane {
            padding-right: 10px;
        }

        .community-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(101, 31, 255, 0.25);
            border: 1px solid var(--glow-violet);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .intro-block-pane h1 {
            font-size: 3.5rem;
            line-height: 1.15;
            margin: 0 0 25px 0;
            letter-spacing: -1.5px;
            font-weight: 800;
        }

        .intro-block-pane h1 span {
            color: var(--accent-pink);
            text-shadow: 0 0 20px rgba(255, 64, 129, 0.2);
        }

        .intro-block-pane p {
            font-size: 1.15rem;
            color: var(--text-dim);
            margin: 0 0 35px 0;
            line-height: 1.65;
        }

        /* Interactive Floating Card Structure */
        .glass-ui-card {
            background: var(--panel-purple);
            border: 1px solid var(--border-glass);
            border-radius: var(--card-radius);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s, border-color 0.4s;
        }

        .glass-ui-card:hover {
            transform: translateY(-6px);
            background: var(--panel-hover);
            border-color: rgba(101, 31, 255, 0.4);
            box-shadow: 0 30px 60px rgba(101, 31, 255, 0.18);
        }

        .glass-ui-card h2 {
            font-size: 1.9rem;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
            font-weight: 800;
        }

        .form-helper-text {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin: 0 0 30px 0;
        }

        /* --- Clean Form Inputs --- */
        .form-element-wrapper {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-dim);
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 15px;
            background-color: var(--input-dark);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-pink);
            box-shadow: 0 0 0 4px rgba(255, 64, 129, 0.15);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
            font-family: inherit;
        }

        .conditional-input {
            margin-top: 12px;
            display: none;
            border-color: var(--glow-violet);
        }

        .action-button {
            background: linear-gradient(135deg, var(--glow-violet), #4a148c);
            color: var(--text-light);
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(101, 31, 255, 0.25);
            transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .action-button:hover {
            box-shadow: 0 8px 25px rgba(101, 31, 255, 0.5);
            opacity: 0.95;
        }

        .action-button:active {
            transform: scale(0.99);
        }

        /* --- Section 2: Bottom Review Hub --- */
        .section-break-line {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
            margin: 40px 0 80px 0;
        }

        .review-header-center {
            text-align: center;
            margin-bottom: 60px;
        }

        .review-header-center h2 {
            font-size: 2.6rem;
            letter-spacing: -1px;
            margin: 0 0 12px 0;
            font-weight: 800;
        }

        .reviews-split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        .testimonial-container-stack {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .feedback-bubble-card {
            background-color: rgba(22, 14, 48, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--card-radius);
            padding: 30px;
            transition: background-color 0.25s, transform 0.25s;
        }

        .feedback-bubble-card:hover {
            background-color: rgba(22, 14, 48, 0.7);
            transform: translateX(6px);
        }

        .rating-stars {
            color: #ffca28;
            margin-bottom: 12px;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .feedback-text {
            color: var(--text-dim);
            font-style: italic;
            margin: 0 0 15px 0;
            font-size: 1.05rem;
        }

        .author-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .inline-contact-row {
            margin-top: 35px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .phone-cta-link {
            color: var(--accent-pink);
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .phone-cta-link:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            padding: 80px 20px 40px 20px;
            color: var(--text-dim);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 40px;
        }

        /* --- Full Mobile Layout Optimization --- */
        @media (max-width: 950px) {
            .workspace-grid, .reviews-split-layout {
                grid-template-columns: 1fr;
                gap: 45px;
            }
