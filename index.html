<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tharpe IT Services Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cyber-header">
        <div class="nav-container">
            <img src="logo.png" alt="Tharpe IT Services Logo" class="site-logo">
            <h1>Tharpe IT Services</h1>
            <a href="sms:+12078493939" class="btn-text-me header-text-btn">💬 Text For Help</a>
        </div>
    </header>

    <section class="hero-split-grid">
        <div class="banner-container">
            <img src="hero.png" alt="Tharpe IT Services Layout Banner" class="full-responsive-banner">
            <div class="hero-text-label">For Your IT Needs</div>
        </div>

        <section id="ticketing-system" class="glass-card hero-form-card">
            <h2>Submit a Support Ticket</h2>
            <form id="ticketForm" action="https://formspree.io" method="POST">
                <!-- Form inputs for Name, Email, Category, Priority, and Description -->
                <input type="hidden" name="_next" value="https://tharpeitservices.com">
                <button type="submit" class="btn-cyber">Dispatch Ticket</button>
            </form>
        </section>
    </section>
</body>
</html>
