<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tharpe IT Services - Interactive Support & Review Center</title>
    <style>
        /* --- Dynamic Purple Theme Design System --- */
        :root {
            --bg-deep: #080415;
            --card-purple: #120b29;
            --card-hover: #191038;
            --input-bg: #05020c;
            --neon-violet: #651fff;
            --neon-pink: #ff4081;
            --text-main: #ffffff;
            --text-muted: #aaa6c3;
            --glow: 0 0 20px rgba(101, 31, 255, 0.35);
        }

        /* Smooth scrolling behaviors */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Interactive Custom Sticky Navbar */
        nav {
            position: sticky;
            top: 0;
            background: rgba(18, 11, 41, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            margin-left: 25px;
            font-size: 0.95rem;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .nav-links a:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
        }

        /* --- HERO HEADER SECTION (Integrates hero.png as centerpiece) --- */
        .hero-banner-section {
            background-image: linear-gradient(rgba(8, 4, 21, 0.75), var(--bg-deep)), url('hero.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 80px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- Core Workspace Grid --- */
        .hero-workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 50px;
            align-items: start;
        }

        /* Brand Value Column */
        .brand-pitch-card {
            padding-right: 20px;
        }

        .brand-pitch-card h1 {
            font-size: 3.4rem;
            line-height: 1.1;
            margin: 0 0 20px 0;
            letter-spacing: -1.5px;
        }

        .brand-pitch-card h1 span {
            color: var(--neon-pink);
            text-shadow: 0 0 15px rgba(255, 64, 129, 0.3);
        }

        .badge-row {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(101, 31, 255, 0.3);
            border: 1px solid var(--neon-violet);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .stat-box-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .stat-card {
            background: var(--card-purple);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            font-size: 2rem;
            color: var(--neon-pink);
            margin: 0;
        }

        /* Interactive Glassmorphic Form Cards */
        .interactive-form-card {
            background-color: var(--card-purple);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .interactive-form-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--glow);
            border-color: rgba(101, 31, 255, 0.4);
        }

        .interactive-form-card h2 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .form-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 30px 0;
        }

        .input-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 14px;
            background-color: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-pink);
            box-shadow: 0 0 0 3px rgba(255, 64, 129, 0.2);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        /* Interactive Action Buttons */
        .submit-btn {
            background: linear-gradient(135deg, var(--neon-violet), #4a148c);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(101, 31, 255, 0.3);
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            box-shadow: 0 5px 20px rgba(101, 31, 255, 0.6);
            transform: scale(1.01);
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        /* --- Section 2: Bottom Review & Testimonial Workspace --- */
        .reviews-wrapper-section {
            padding: 80px 0;
            background-color: var(--bg-deep);
        }

        .reviews-section-heading {
            text-align: center;
            margin-bottom: 50px;
        }

        .reviews-section-heading h2 {
            font-size: 2.5rem;
            letter-spacing: -1px;
            margin: 0 0 10px 0;
        }

        .review-center-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 50px;
            align-items: start;
        }

        .testimonial-stack {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .testimonial-bubble {
            background-color: var(--card-purple);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            position: relative;
            transition: background-color 0.2s, transform 0.2s;
        }

        .testimonial-bubble:hover {
            background-color: var(--card-hover);
            transform: translateX(5px);
        }

        .stars {
            color: #ffca28;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .quote-text {
            color: var(--text-muted);
            font-style: italic;
            margin: 0 0 15px 0;
        }

        .client-info {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffffff;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom display toggle for "Other" field entry input */
        .conditional-input {
            margin-top: 12px;
            display: none;
        }

        /* Responsive Breakpoints */
        @media (max-width: 950px) {
            .hero-workspace-grid, .review-center-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .brand-pitch-card h1 { font-size: 2.5rem; }
            .hero-banner-section { padding: 40px 0; }
        }
    </style>
</head>
<body>

    <!-- Sticky Navigation Controls -->
    <nav>
        <div class="nav-logo">💻 Tharpe IT Services</div>
        <div class="nav-links">
            <a href="#">Top</a>
            <a href="#ticket-portal">Ticketing System</a>
            <a href="#about-us">Our Representation</a>
            <a href="#reviews-portal">Client Reviews</a>
        </div>
    </nav>

    <!-- TOP CENTRE HERO DISPLAY HUB -->
    <section class="hero-banner-section">
        <div class="container">
            <div class="hero-workspace-grid">
                
                <!-- Left Grid Pane: Brand and Mission Context -->
                <div class="brand-pitch-card" id="about-us">
                    <div class="badge-row">
                        <div class="badge">⚙️ Reliable Local IT Support</div>
